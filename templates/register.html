<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registrarse</title>
</head>
<body>

    <h2>Registrate</h2>

    <form action="/register/" method="POST">
        {% csrf_token %}
        <!-- Campo para el Correo Electrónico -->
        <p>{{error_message}}</p>
        <div>
            <label for="first_name">First Name:</label><br>
            <input type="text" id="first_name" name="first_name" placeholder="Juan" required>
        </div>

        <br>

        <div>
            <label for="last_name">Last Name:</label><br>
            <input type="text" id="last_name" name="last_name" placeholder="Perez" required>
        </div>

        <br>

        <div>
            <label for="username">Nombre De Usuario:</label><br>
            <input type="text" id="username" name="username" placeholder="Juan Antonio" required>
        </div>

        <br>
        <div>
            <label for="email">Nombre:</label><br>
            <input type="email" id="email" name="email" placeholder="tucorreo@example.com" required>
        </div>

        <br>

        <!-- Campo para la Contraseña -->
        <div>
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" >
        </div>

        <br>

        <!-- Opción de Recordarme -->

        <br>

        <!-- Botón de Envío -->
        <button type="submit">Entrar</button>
        <a href="/login/">Ya tienes una cuenta? Inicia Sesion aqui</a>
    </form>

</body>
</html>
